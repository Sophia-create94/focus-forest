<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .card{padding:20px 24px;display:flex;gap:18px;align-items:flex-end;}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .lbl{font-family:var(--font-body);font-size:11px;color:#666;}
  .val{font-family:ui-monospace,monospace;font-size:10px;color:#999;}
  .b{background:#3B7A57;width:32px;}
</style></head>
<body><div class="card">
  <div class="col"><div class="b" style="height:4px"></div><div class="val">4</div><div class="lbl">space-1</div></div>
  <div class="col"><div class="b" style="height:8px"></div><div class="val">8</div><div class="lbl">space-2</div></div>
  <div class="col"><div class="b" style="height:12px"></div><div class="val">12</div><div class="lbl">space-3</div></div>
  <div class="col"><div class="b" style="height:16px"></div><div class="val">16</div><div class="lbl">space-4</div></div>
  <div class="col"><div class="b" style="height:20px"></div><div class="val">20</div><div class="lbl">space-5</div></div>
  <div class="col"><div class="b" style="height:24px"></div><div class="val">24</div><div class="lbl">space-6</div></div>
  <div class="col"><div class="b" style="height:32px"></div><div class="val">32</div><div class="lbl">space-8</div></div>
  <div class="col"><div class="b" style="height:40px"></div><div class="val">40</div><div class="lbl">space-10</div></div>
</div></body></html>

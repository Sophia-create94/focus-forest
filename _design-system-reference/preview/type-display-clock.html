<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
  /* Neutral typography-preview surface — NOT a lock-screen wallpaper.
     The actual lock-screen wallpaper is documented on the Lock-screen notification
     component. This slate is just a mid-tone backdrop so white type renders legibly. */
  html,body{margin:0;padding:0;background:#3F4756;font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;}
  .card{padding:18px 20px 20px;}
  .status{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:0 4px 12px;}
  .status-time{font-family:-apple-system, "SF Pro Text", system-ui, sans-serif;font-size:17px;font-weight:600;letter-spacing:-0.3px;}
  .status-icons{display:flex;align-items:center;gap:5px;}
  .lock-ico{display:flex;justify-content:center;margin-bottom:4px;}
  .date{text-align:center;color:#fff;font-family:ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;font-size:22px;font-weight:500;line-height:1.2;margin-bottom:14px;}
  .clock{text-align:center;color:#fff;font-family:ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;font-size:96px;font-weight:300;letter-spacing:0;line-height:1;}
  .meta{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;font-size:11px;color:rgba(255,255,255,0.7);margin-top:14px;text-align:center;}
  .meta-sub{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;font-size:10.5px;color:rgba(255,255,255,0.5);margin-top:4px;text-align:center;line-height:1.4;font-style:italic;max-width:340px;margin-left:auto;margin-right:auto;}
</style></head>
<body><div class="card">
  <div class="status">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><rect x="0" y="6" width="3" height="5" rx="0.7"/><rect x="4.5" y="4" width="3" height="7" rx="0.7"/><rect x="9" y="2" width="3" height="9" rx="0.7"/><rect x="13.5" y="0" width="3" height="11" rx="0.7"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="#fff"><path d="M7.5 9.4a1.1 1.1 0 110 2.2 1.1 1.1 0 010-2.2zM3.3 5.8a5.9 5.9 0 018.4 0l-1.3 1.3a4.1 4.1 0 00-5.8 0L3.3 5.8zM.5 3a9.7 9.7 0 0114 0l-1.3 1.3a7.8 7.8 0 00-11.4 0L.5 3z"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#fff" stroke-opacity="0.5" stroke-width="1"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#fff"/><path d="M23 4v4a1.5 1.5 0 000-4z" fill="#fff" fill-opacity="0.5"/></svg>
    </div>
  </div>
  <div class="lock-ico">
    <svg width="13" height="16" viewBox="0 0 14 17" fill="#fff"><path d="M7 0a4 4 0 014 4v3h1.2c.4 0 .8.4.8.9v8c0 .5-.4.9-.8.9H1.8c-.4 0-.8-.4-.8-.9V8c0-.5.4-.9.8-.9H3V4a4 4 0 014-4zm0 1.5A2.5 2.5 0 004.5 4v3h5V4A2.5 2.5 0 007 1.5z"/></svg>
  </div>
  <div class="date">Monday, June 3</div>
  <div class="clock">9:41</div>
  <div class="meta">SF Pro Rounded · Light · 96px · system surface (not brand type)</div>
  <div class="meta-sub">Type styling only — wallpaper is documented separately on the Lock-screen notification component.</div>
</div></body></html>

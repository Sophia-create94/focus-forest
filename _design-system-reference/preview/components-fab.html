<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#4A9468;}
  .card{padding:24px;display:flex;gap:18px;align-items:center;}
  .fab{width:54px;height:54px;background:#F6AE2D;border-radius:9999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.3);}
  .fab.open{background:var(--ff-moss);}
  .sub{width:52px;height:52px;background:rgba(255,255,255,0.93);border-radius:9999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,0.3);}
  .lbl{font-family:var(--font-body);font-size:13px;color:#fff;margin-top:6px;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,0.5);font-weight:500;}
  .col{display:flex;flex-direction:column;align-items:center;}
</style></head>
<body><div class="card">
  <div class="col"><div class="fab"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="13" y1="4" x2="13" y2="22"/><line x1="4" y1="13" x2="22" y2="13"/></svg></div><div class="lbl">Add</div></div>
  <div class="col"><div class="fab open"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" style="transform:rotate(45deg)"><line x1="13" y1="4" x2="13" y2="22"/><line x1="4" y1="13" x2="22" y2="13"/></svg></div><div class="lbl">Open</div></div>
  <div class="col"><div class="sub"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B7A57" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div class="lbl">Calendar</div></div>
  <div class="col"><div class="sub"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B7A57" stroke-width="2" stroke-linecap="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div><div class="lbl">To-do-list</div></div>
  <div class="col"><div class="sub"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B7A57" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="lbl">Countdown</div></div>
</div></body></html>

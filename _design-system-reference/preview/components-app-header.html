<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .card{padding:0;}
  .header{background:#4A9468;padding:0 20px;height:54px;display:flex;align-items:center;}
  .logo{width:30px;height:30px;background:#3B7A57;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-size:13px;font-weight:700;}
  .title{font-family:var(--font-display);font-size:18px;font-weight:400;color:#fff;margin-left:9px;letter-spacing:-0.2px;}
  .spacer{flex:1;}
  .dots{color:#fff;font-size:22px;}
  .tabs{background:#4A9468;display:flex;padding:0 12px;border-bottom:1px solid rgba(255,255,255,0.1);}
  .tab{font-family:var(--font-body);font-size:16px;font-weight:500;color:rgba(255,255,255,0.6);padding:9px 14px 10px;border-bottom:2.5px solid transparent;}
  .tab.active{color:#fff;border-bottom-color:#fff;font-weight:600;}
</style></head>
<body><div class="card">
  <div class="header">
    <div class="logo">ff</div>
    <span class="title">focusforest</span>
    <div class="spacer"></div>
    <span class="dots">⋮</span>
  </div>
  <div class="tabs">
    <span class="tab">Calendar</span>
    <span class="tab active">To-do-list</span>
    <span class="tab">Countdown</span>
  </div>
</div></body></html>

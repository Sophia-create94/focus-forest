<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-body);color:#111;}
  .card{padding:20px 24px;box-sizing:border-box;}
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .swatch{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .chip{width:64px;height:64px;border-radius:12px;border:1px solid rgba(0,0,0,0.06);}
  .chip.sm{width:44px;height:44px;border-radius:10px;}
  .chip.circle{border-radius:50%;}
  .lbl{font-family:var(--font-body);font-size:11px;color:#666;line-height:1.3;}
  .name{font-family:var(--font-body);font-size:12px;font-weight:600;color:#111;}
  .hex{font-family:ui-monospace,monospace;font-size:11px;color:#666;}
  .h{font-family:var(--font-display);font-size:13px;font-weight:600;color:#111;margin:0 0 12px;letter-spacing:0.02em;text-transform:uppercase;}
</style></head>
<body><div class="card">
<div class="row">
  <div class="swatch"><div class="chip" style="background:#3B7A57"></div><div class="name">Primary</div><div class="hex">#3B7A57</div></div>
  <div class="swatch"><div class="chip" style="background:#FFFFFF;border:1px solid #ddd"></div><div class="name">Secondary</div><div class="hex">#FFFFFF</div></div>
  <div class="swatch"><div class="chip" style="background:#F6AE2D"></div><div class="name">Yellow</div><div class="hex">#F6AE2D</div></div>
  <div class="swatch"><div class="chip" style="background:#EB9C0A"></div><div class="name">Yellow Dark</div><div class="hex">#EB9C0A</div></div>
  <div class="swatch"><div class="chip" style="background:#0E0F0C"></div><div class="name">Black</div><div class="hex">#0E0F0C</div></div>
</div>
</div></body></html>

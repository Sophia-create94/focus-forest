<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .card{padding:24px;display:flex;align-items:center;gap:24px;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .lbl{font-family:var(--font-body);font-size:11px;color:#666;}
  img{display:block;}
  .mark{width:64px;height:64px;background:#3B7A57;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-size:26px;font-weight:500;letter-spacing:-1px;}
  .word{display:flex;align-items:center;gap:10px;}
  .wm{font-family:var(--font-display);font-size:22px;font-weight:400;color:#3B7A57;letter-spacing:-0.3px;}
  .small{width:30px;height:30px;font-size:12px;font-weight:700;}
</style></head>
<body><div class="card">
  <div class="item"><div class="mark">ff</div><div class="lbl">App icon · 64</div></div>
  <div class="item"><div class="word"><div class="mark small">ff</div><span class="wm">focusforest</span></div><div class="lbl">Wordmark</div></div>
  <div class="item"><div class="mark small">ff</div><div class="lbl">In-app · 30</div></div>
</div></body></html>

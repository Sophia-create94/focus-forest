<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#3B7A57;}
  .nav{background:#4A9468;height:82px;padding:0 10px 14px;display:flex;align-items:flex-end;justify-content:space-around;position:relative;}
  .item{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,0.65);}
  .item.active{color:#F6AE2D;}
  .lbl{font-family:var(--font-body);font-size:16px;font-weight:500;color:#fff;}
  .fab-w{position:relative;display:flex;flex-direction:column;align-items:center;}
  .fab{width:54px;height:54px;background:#F6AE2D;border-radius:9999px;display:flex;align-items:center;justify-content:center;margin-top:-30px;box-shadow:0 4px 16px rgba(0,0,0,0.3);}
</style></head>
<body><div class="nav">
  <div class="item active">
    <svg width="22" height="20" viewBox="0 0 22 20" fill="currentColor"><path d="M9 19v-6h4v6h5v-8h3L11 1 1 11h3v8z"/></svg>
    <span class="lbl">Home</span>
  </div>
  <div class="item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span class="lbl">Plans</span>
  </div>
  <div class="fab-w">
    <div class="fab"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="13" y1="4" x2="13" y2="22"/><line x1="4" y1="13" x2="22" y2="13"/></svg></div>
    <span class="lbl" style="margin-top:6px">Add</span>
  </div>
  <div class="item">
    <svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="3.5"/><line x1="11" y1="2" x2="11" y2="3.5"/><line x1="11" y1="18.5" x2="11" y2="20"/><line x1="2" y1="11" x2="3.5" y2="11"/><line x1="18.5" y1="11" x2="20" y2="11"/><line x1="4.5" y1="4.5" x2="5.5" y2="5.5"/><line x1="16.5" y1="16.5" x2="17.5" y2="17.5"/><line x1="4.5" y1="17.5" x2="5.5" y2="16.5"/><line x1="16.5" y1="5.5" x2="17.5" y2="4.5"/></svg>
    <span class="lbl">Today</span>
  </div>
  <div class="item">
    <svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="7" r="4"/><path d="M3 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
    <span class="lbl">Profile</span>
  </div>
</div></body></html>

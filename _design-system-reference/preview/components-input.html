<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#3B7A57;}
  .card{padding:24px;display:flex;flex-direction:column;gap:14px;}
  .input{background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.25);border-radius:10px;padding:9px 14px;color:#fff;font-family:var(--font-body);font-size:14px;}
  .input::placeholder{color:rgba(255,255,255,0.45);}
  .input.focus{background:rgba(255,255,255,0.28);}
  .lbl{font-family:var(--font-body);font-size:11px;color:rgba(255,255,255,0.65);}
</style></head>
<body><div class="card">
  <div class="lbl">Search input · default</div>
  <input class="input" placeholder="Search" />
  <div class="lbl">Search input · focus</div>
  <input class="input focus" value="pancake" />
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .card{padding:14px 20px;}
  .meta{font-family:var(--font-body);font-size:11px;color:#999;margin-bottom:8px;}
  .quote{font-family:var(--font-display);font-size:18px;font-weight:500;color:#3B7A57;line-height:1.35;letter-spacing:-0.2px;}
  .line{font-family:var(--font-body);font-size:13px;color:#444;margin-top:6px;}
  .dont{color:#AC111E;text-decoration:line-through;}
  .row{display:flex;justify-content:space-between;gap:24px;margin-top:10px;}
  .col{flex:1;}
  .h{font-family:var(--font-body);font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
</style></head>
<body><div class="card">
  <div class="meta">Voice · warm, second-person, sentence case</div>
  <div class="quote">"Good job! You reached level 5"</div>
  <div class="line">"You wanted to do sports today. Please choose from the below."</div>
  <div class="row">
    <div class="col"><div class="h">Do</div><div class="line">"Welcome!" · "I am done"</div></div>
    <div class="col"><div class="h">Don't</div><div class="line dont">"Crush your goals 💪"</div></div>
  </div>
</div></body></html>

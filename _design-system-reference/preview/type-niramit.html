<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css?v=type2"/>
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-body);color:#111;}
  .card{padding:22px 26px 24px;box-sizing:border-box;}
  .head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .title{font-family:var(--font-display);font-weight:600;font-size:20px;color:#111;letter-spacing:-0.01em;}
  .subtitle{font-family:var(--font-body);font-size:12px;color:#666;line-height:1.4;}

  /* Compact family showcase */
  .row{display:flex;gap:36px;align-items:flex-end;}
  .w{
    display:flex;flex-direction:column;align-items:flex-start;gap:6px;
    font-family:var(--font-display);color:#111;line-height:1;letter-spacing:-0.01em;
  }
  .w .glyph{font-size:64px;line-height:0.9;letter-spacing:-0.02em;}
  .w .label{font-family:var(--font-body);font-size:11px;font-weight:500;color:#666;letter-spacing:.02em;}
  .w .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#aaa;}
</style></head>
<body><div class="card">
  <div class="head">
    <div class="title">Niramit</div>
    <div class="subtitle">Display family — headings, CTAs, FAB labels, emphatic UI</div>
  </div>

  <div class="row">
    <div class="w"><div class="glyph" style="font-weight:300">Aa</div><div class="label">Light</div><div class="num">300</div></div>
    <div class="w"><div class="glyph" style="font-weight:400">Aa</div><div class="label">Regular</div><div class="num">400</div></div>
    <div class="w"><div class="glyph" style="font-weight:500">Aa</div><div class="label">Medium</div><div class="num">500</div></div>
    <div class="w"><div class="glyph" style="font-weight:600">Aa</div><div class="label">Semi-Bold</div><div class="num">600</div></div>
    <div class="w"><div class="glyph" style="font-weight:700">Aa</div><div class="label">Bold</div><div class="num">700</div></div>
  </div>
</div></body></html>

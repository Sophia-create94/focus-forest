<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .card{padding:18px 24px;}
  .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .ico{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#3B7A57;}
  .col{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .lbl{font-family:var(--font-body);font-size:10px;color:#666;}
  .meta{font-family:var(--font-body);font-size:11px;color:#999;margin-bottom:8px;}
</style></head>
<body><div class="card">
  <div class="meta">Inline SVG · 2px stroke · round caps · currentColor</div>
  <div class="row">
    <div class="col"><div class="ico"><svg width="22" height="20" viewBox="0 0 22 20" fill="currentColor"><path d="M9 19v-6h4v6h5v-8h3L11 1 1 11h3v8z"/></svg></div><div class="lbl">home</div></div>
    <div class="col"><div class="ico"><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="3.5"/><line x1="11" y1="2" x2="11" y2="3.5"/><line x1="11" y1="18.5" x2="11" y2="20"/><line x1="2" y1="11" x2="3.5" y2="11"/><line x1="18.5" y1="11" x2="20" y2="11"/><line x1="4.5" y1="4.5" x2="5.5" y2="5.5"/><line x1="16.5" y1="16.5" x2="17.5" y2="17.5"/><line x1="4.5" y1="17.5" x2="5.5" y2="16.5"/><line x1="16.5" y1="5.5" x2="17.5" y2="4.5"/></svg></div><div class="lbl">today</div></div>
    <div class="col"><div class="ico"><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="7" r="4"/><path d="M3 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></div><div class="lbl">profile</div></div>
    <div class="col"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div class="lbl">calendar</div></div>
    <div class="col"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div><div class="lbl">to-do</div></div>
    <div class="col"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></div><div class="lbl">trash</div></div>
    <div class="col"><div class="ico"><svg width="22" height="22" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="13" y1="4" x2="13" y2="22"/><line x1="4" y1="13" x2="22" y2="13"/></svg></div><div class="lbl">add</div></div>
    <div class="col"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="lbl">countdown</div></div>
    <div class="col"><div class="ico"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div><div class="lbl">pencil</div></div>
    <div class="col"><div class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4.5 12H8L3 19h7v3h4v-3h7l-5-7h3.5L12 2z"/></svg></div><div class="lbl">tree</div></div>
    <div class="col"><div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></div><div class="lbl">chevron-right</div></div>
  </div>
</div></body></html>
